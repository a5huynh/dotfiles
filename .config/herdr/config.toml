onboarding = false

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false

# Workspace labels run long ("walmart-api-integration" is 23 cols on its own),
# and every agent row has to carry one because agent_panel_sort = "priority"
# orders by attention queue rather than grouping under space headers.
sidebar_width = 32
sidebar_max_width = 36

# Vertical space is the binding constraint, not width: the default two-rows-per
# entry costs 2 lines x every agent + 2 x every space, which overflows the
# sidebar well before the agent list is interesting.
#
# terminal_title_stripped is what makes the difference, and it is only worth a
# row for an agent that reports its *task* there. claude does ("Review pull
# request #871"), and that second row is also the only thing telling apart two
# of its sessions sharing a tab.
#
# pi reported "π - <dirname>" — a restatement of the workspace the row already
# names — so it was left on one row. ../../.pi/agent/extensions/session-title.ts
# now writes the session's first user prompt there instead, so pi earns the same
# second row. That extension is gated on HERDR_ENV, so a pi started outside
# herdr keeps its own title; if it is ever unlinked, this row degrades to the
# old "π - <dirname>" rather than going blank.
#
# Every token here is styled explicitly, and dim = false is load-bearing on all
# of them: omitted style fields inherit the *contextual* default, which is dim,
# and that drops these colors to ~3:1 against the panel — washed-out grey.
# plugins/tab-jump/jump.sh gets away with bare hex because it writes raw ANSI
# with no dim attribute; the sidebar does not.
#
# Brightness tracks information value, brightest first:
#   tab   #c0caf5 bold  8.3:1  hand-named, the most specific field in the row
#   title #a9b1d6       6.4:1  the task, for claude and pi
#   ws    #7aa2f7       5.3:1  context only; blue reads as location
# The tab/workspace order matters: leaving workspace at its default made mere
# context outrank identity.
[ui.sidebar.agents]
row_gap = 0
rows = [[
  "state_icon",
  { token = "workspace", fg = "#7aa2f7", dim = false },
  { token = "tab", fg = "#c0caf5", bold = true, dim = false },
]]

[ui.sidebar.agents.rows_by_agent]
claude = [
  [
    "state_icon",
    { token = "workspace", fg = "#7aa2f7", dim = false },
    { token = "tab", fg = "#c0caf5", bold = true, dim = false },
  ],
  [{ token = "terminal_title_stripped", fg = "#a9b1d6", dim = false }],
]
pi = [
  [
    "state_icon",
    { token = "workspace", fg = "#7aa2f7", dim = false },
    { token = "tab", fg = "#c0caf5", bold = true, dim = false },
  ],
  [{ token = "terminal_title_stripped", fg = "#a9b1d6", dim = false }],
]

# The upstream default second row is ["branch", "git_status"]. Neither token
# renders anything here — verified visually, not just inferred from the API,
# which also omits both fields: these workspaces are plain directories, not git
# worktrees, so herdr has no git state to report. Re-adding either from the
# default config just costs a blank line per space.
#
# $agents is not a built-in — the space-row built-ins are still only state_icon,
# state_text, workspace, branch and git_status, verified against 0.9.1 (`rows`
# rejects anything else with "unknown sidebar token; custom tokens must start
# with `$`"). 0.9 added a `machine` token, but to the *agent* rows only. So this
# stays a custom metadata token reported by plugins/space-agents/, which counts
# the agents in each workspace. If that plugin is ever unlinked the token simply
# renders empty and the row degrades to the "state_icon workspace" it was before.
#
# Base color is the dimmest in the file, one rung below the sidebar agent rows'
# "context" blue: a count is the least identifying thing in the row, and
# state_icon already carries the part that wants your eye. #737aa2 is overlay1
# from [theme.custom] below, ~4:1 on the panel. dim = false for the same reason
# it is set on every other token here — omitting it inherits the contextual
# default, which is dim, and would drop this to an unreadable ~2:1.
#
# `rules` (herdr 0.9+) colors the count by threshold, which is what lets
# space-agents emit a *bare* number: the `·` prefix that used to keep it from
# reading as a workspace number would break these rules, since gt/lt are numeric
# and "·7" does not parse as a number — it would validate and then never match.
#
# Three traps here, all verified with `herdr config check` against a sandboxed
# HOME rather than a live session:
#   - Order is highest-threshold-first, and the FIRST matching rule wins — this
#     was confirmed by observation (a workspace of 8 rendered red, not yellow),
#     since it is not recoverable from the binary. A value of 7 satisfies both
#     rules below, so the ordering is load-bearing, not cosmetic: reversed, the
#     red rule would be unreachable and every busy space would read yellow.
#   - Each rule takes EXACTLY ONE of equals/contains/starts_with/gt/lt. Zero
#     conditions or two conditions is a *file-level* TOML error: herdr reports
#     "; using defaults" and discards every customization in this file, not just
#     this token. A typo here costs the whole config, silently.
#   - herdr ≤ 0.8 rejects the `rules` key the same file-level way, so every
#     machine sharing this repo must be on 0.9+ before this is committed.
[ui.sidebar.spaces]
row_gap = 0
rows = [[
  "state_icon",
  "workspace",
  { token = "$agents", fg = "#737aa2", dim = false, rules = [
    { gt = 5, fg = "#f7768e" },  # crowded — tokyo-night red
    { gt = 2, fg = "#e0af68" },  # busy — tokyo-night yellow
  ] },
]]

[ui.toast]
# Desktop notification when a background agent pane finishes or is blocked.
delivery = "system"

[theme]
name = "tokyo-night"

# Neutrals pinned to pi's ~/.pi/agent/themes/tokyo-night.json so herdr's
# surfaces/overlays match pi exactly. All accent colors already match the
# built-in tokyo-night palette.
[theme.custom]
surface0    = "#292e42"  # pi bgHighlight / selectedBg
surface1    = "#3b4261"  # pi borderMuted
surface_dim = "#16161e"  # pi bgDark
overlay1    = "#737aa2"  # pi dim
subtext0    = "#9aa5ce"  # pi muted

# Keybindings mirrored from ~/.config/zellij/config.kdl — specifically its `tmux`
# mode, which is already prefix-shaped. zellij's other modes are modal (sticky
# `Ctrl p` pane mode etc.) and have no herdr equivalent; herdr is prefix-only.
# Each action lists the zellij binding first and keeps herdr's default as an alias.
[keys]
prefix = "ctrl+b"  # same prefix zellij uses to enter tmux mode

# Splits intentionally left at herdr defaults: prefix+v = split right,
# prefix+minus = split down. Careful when comparing to tmux — the names are
# inverted: tmux's "vertical" split (`"`) stacks downward, whereas herdr's
# split_vertical splits to the right.

rename_tab = ["prefix+comma", "prefix+shift+t"]  # zellij tmux-mode `,`
detach     = ["prefix+d", "prefix+q"]            # zellij tmux-mode `d`

# zellij tmux-mode `o` cycles panes, but herdr ships `o` as
# open_notification_target, so that one moves to shift+o.
cycle_pane_next          = ["prefix+o", "prefix+tab"]
open_notification_target = "prefix+shift+o"

# zellij moves pane focus without the prefix via Alt+hjkl, and also binds bare
# arrows inside its tmux mode - so prefix+<arrow> mirrors zellij directly.
# Arrows deliberately go through the prefix instead of plain alt: Ghostty binds
# alt+arrow_left / alt+arrow_right to esc:b / esc:f (readline word-motion) by
# default, so alt+left/right never reach herdr. Bare alt+hjkl is unaffected.
focus_pane_left  = ["prefix+h", "alt+h", "prefix+left"]
focus_pane_down  = ["prefix+j", "alt+j", "prefix+down"]
focus_pane_up    = ["prefix+k", "alt+k", "prefix+up"]
focus_pane_right = ["prefix+l", "alt+l", "prefix+right"]

# Mirrors zellij's `Ctrl y` -> room.wasm floating tab search. herdr ships a
# built-in `goto` (prefix+g), but it is pane-granular and too noisy; this is
# tabs only. Lives in .config/herdr/plugins/tab-jump/ and is registered with
# the server by `just bootstrap-herdr-plugins`, not by a symlink.
# NOTE: [[keys.command]] must stay last — any bare key after it would be parsed
# into the command table rather than [keys].
[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "jump"
description = "Jump to tab"
